services:
  postgres:
    image: postgres:16-alpine
    container_name: pesaloom-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pesaloom}
      POSTGRES_USER: ${DB_USER:-pesaloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pesaloom_dev_only}
    ports:
      - "${DB_PORT:-8085}:5432"
    volumes:
      - pesaloom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pesaloom} -d ${DB_NAME:-pesaloom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: pesaloom-mailpit
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025" # SMTP — point spring.mail.host/port here in dev
      - "${MAIL_UI_PORT:-8025}:8025"   # web UI at http://localhost:8025 to inspect sent mail

volumes:
  pesaloom_pgdata:
