services:
  postgres:
    image: postgres:16-alpine
    container_name: lendswift-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-lendswift}
      POSTGRES_USER: ${DB_USER:-lendswift}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lendswift_dev_only}
    ports:
      - "${DB_PORT:-8085}:5432"
    volumes:
      - lendswift_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lendswift} -d ${DB_NAME:-lendswift}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lendswift_pgdata:
