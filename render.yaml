databases:
  - name: pesaloom-db
    databaseName: pesaloom
    user: pesaloom
    plan: free

services:
  - type: web
    name: pesaloom-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: pesaloom-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pesaloom-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pesaloom-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pesaloom-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pesaloom-db
          property: password

      - key: JWT_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
