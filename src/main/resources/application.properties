spring.application.name=pesaloom
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


server.port=${PORT:${SERVER_PORT:8086}}

# No UserDetailsService/AuthenticationManager is used anywhere (AuthService checks credentials
# directly via PasswordEncoder), so suppress Boot's default in-memory-user auto-configuration.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${FRONTEND_BASE_URL}

app.storage.root-dir=${STORAGE_ROOT_DIR:./storage}
spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${STORAGE_MAX_REQUEST_SIZE_MB:15}MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@pesaloom.example}


management.health.mail.enabled=false
