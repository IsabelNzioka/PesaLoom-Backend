# Dev-only defaults. Never used in prod (SPRING_PROFILES_ACTIVE=prod / real env vars override these).
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:8085}/${DB_NAME:pesaloom}
spring.datasource.username=${DB_USER:pesaloom}
spring.datasource.password=${DB_PASSWORD:pesaloom_dev_only}

# Adds the dev-only seed migrations (e.g. the seeded admin user) on top of the real ones.
# db/dev-migration is a sibling of db/migration, not a subdirectory — see the note in
# application.properties for why that distinction matters here.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-migration

# Dev-only signing key. Generated with `openssl rand -base64 32`. Rotate/override via JWT_SECRET in any real environment.
app.jwt.secret=${JWT_SECRET:6W9k8IxwZuDA2I2oCQmWtaiIxQ5REkuUvYhVbsPWzuc=}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Points at the Mailpit container from docker-compose.yml — view sent mail at http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

spring.jpa.show-sql=true
logging.level.com.pesaloom=DEBUG
